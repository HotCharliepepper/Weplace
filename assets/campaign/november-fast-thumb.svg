<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">광고, 하지 마세요.</title><desc id="desc">11월 FAST 캠페인. 어차피 돈만 들지 않나요? 라는 질문을 짙은 초록 배경의 큰 글자와 주황색 경고 표시로 보여주는 썸네일</desc>
