<linearGradient id="light" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#a5eab7" stop-opacity="0"/><stop offset=".5" stop-color="#a5eab7" stop-opacity=".28"/><stop offset="1" stop-color="#a5eab7" stop-opacity="0"/></linearGradient>
