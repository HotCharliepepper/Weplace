<svg xmlns="http://www.w3.org/2000/svg" width="620" height="460" viewBox="0 0 620 460" role="img" aria-labelledby="art-title art-desc">
  <title id="art-title">비슷한 초록, 서로 다른 두 식재료</title>
  <desc id="art-desc">서로 비슷한 초록색의 두 식재료. 표면과 단면의 차이를 관찰하는 선택형 그림</desc>
  <defs>
    <linearGradient id="night" x1=".1" y1="0" x2=".95" y2="1"><stop stop-color="#153d2d"/><stop offset=".6" stop-color="#081f16"/><stop offset="1" stop-color="#163427"/></linearGradient>
    <linearGradient id="pepper" x1="0" y1=".2" x2="1" y2=".85"><stop stop-color="#b2ce51"/><stop offset=".13" stop-color="#4d941f"/><stop offset=".32" stop-color="#1b641e"/><stop offset=".67" stop-color="#0d4216"/><stop offset=".86" stop-color="#75ac31"/><stop offset="1" stop-color="#0c3918"/></linearGradient>
    <linearGradient id="okra" x1="0" y1="0" x2="1" y2=".8"><stop stop-color="#a0b54a"/><stop offset=".21" stop-color="#446f23"/><stop offset=".5" stop-color="#193e19"/><stop offset=".72" stop-color="#587f2f"/><stop offset="1" stop-color="#152e18"/></linearGradient>
    <radialGradient id="focus"><stop stop-color="#d3aa68" stop-opacity=".19"/><stop offset="1" stop-color="#e5d099" stop-opacity="0"/></radialGradient>
    <radialGradient id="core"><stop stop-color="#f2edc6"/><stop offset=".75" stop-color="#d0d793"/><stop offset="1" stop-color="#78963d"/></radialGradient>
    <linearGradient id="pepInner"><stop stop-color="#daef93"/><stop offset=".54" stop-color="#8dad4d"/><stop offset="1" stop-color="#457421"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="8"/></filter>
    <pattern id="grid" width="54" height="54" patternUnits="userSpaceOnUse"><path d="M54 0H0V54" fill="none" stroke="#fff" stroke-opacity=".045" stroke-width=".8"/></pattern>
  </defs>
  <rect width="620" height="460" fill="url(#night)"/><rect width="620" height="460" fill="url(#grid)"/>
  <ellipse cx="300" cy="170" rx="240" ry="160" fill="url(#focus)"/>
  <path d="M310 37V435" stroke="#c6ae7f" stroke-opacity=".4" stroke-width=".8"/>
  <ellipse cx="153" cy="407" rx="115" ry="19" fill="#000" opacity=".5" filter="url(#shadow)"/>
  <ellipse cx="450" cy="405" rx="116" ry="18" fill="#000" opacity=".5" filter="url(#shadow)"/>
  <!-- glossy chili -->
  <path d="M155 100C116 79 96 112 99 135C105 171 131 182 123 232C120 266 101 302 122 343C141 384 183 370 205 318C222 274 207 232 203 191C196 151 196 119 155 100Z" fill="url(#pepper)" stroke="#a7be58" stroke-width="2"/>
  <path d="M150 107C128 136 139 185 135 242C130 299 133 331 141 348" fill="none" stroke="#d7ec81" stroke-opacity=".62" stroke-linecap="round" stroke-width="9"/>
  <path d="M175 110C197 140 186 194 189 235C193 288 179 325 157 350" fill="none" stroke="#0e2c13" stroke-opacity=".38" stroke-width="12"/>
  <path d="M155 102C156 85 152 62 165 48C172 40 185 37 190 39" fill="none" stroke="#699536" stroke-width="16" stroke-linecap="round"/>
  <path d="M155 102C155 83 159 65 169 57" fill="none" stroke="#b1c66c" stroke-width="5" stroke-linecap="round"/>
  <path d="M152 120c-28-8-30-16-31-25M152 120c16-8 28-15 31-26" stroke="#3b7523" stroke-width="13" fill="none" stroke-linecap="round"/>
  <ellipse cx="125" cy="173" rx="5" ry="13" fill="#d5e88e" opacity=".55" transform="rotate(19 125 173)"/>
  <ellipse cx="185" cy="286" rx="5" ry="16" fill="#dbe69e" opacity=".25" transform="rotate(25 185 286)"/>
  <!-- pepper slice -->
