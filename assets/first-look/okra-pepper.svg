  <path d="M443 78C438 60 443 43 447 31" fill="none" stroke="#789c41" stroke-width="14" stroke-linecap="round"/>
  <path d="M442 88L419 90 407 112M444 88L468 87 481 104" fill="none" stroke="#4e7b31" stroke-width="14" stroke-linecap="round"/>
  <g opacity=".35" stroke="#cce48c" stroke-width="1" stroke-linecap="round">
    <path d="M391 163l-5-9M397 203l-6-6M401 248l-5 3M490 179l8-8M488 214l7 4M486 270l8 3M424 345l-7 7M469 343l7 7"/>
  </g>
  <!-- five-point star cut of okra -->
  <g transform="translate(510 346)">
    <path d="M0-61L19-33L49-39L45-8L65 17L35 32L22 60L0 43L-29 57L-38 26L-64 8L-43-15L-40-43L-11-34Z" fill="#4e792e" stroke="#b7c67a" stroke-width="7" stroke-linejoin="round"/>
