    <ellipse cx="0" cy="0" rx="57" ry="36" fill="#133113" stroke="#85af47" stroke-width="5"/>
    <ellipse cx="0" cy="0" rx="44" ry="27" fill="url(#pepInner)"/>
    <path d="M-21-8C-4-23 14-16 25-8M-16 8C1 20 17 18 27 8" fill="none" stroke="#edf4b8" stroke-width="4"/>
    <g fill="#fbefbb"><ellipse cx="-12" cy="-3" rx="7" ry="4"/><ellipse cx="0" cy="-13" rx="6" ry="3"/><ellipse cx="13" cy="4" rx="7" ry="4"/><ellipse cx="-1" cy="10" rx="6" ry="4"/></g>
  </g>
