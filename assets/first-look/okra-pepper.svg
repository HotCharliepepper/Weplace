  <path d="M442 76C395 70 378 119 383 168C390 217 409 246 412 285C415 337 422 369 449 389C472 365 488 330 496 277C501 225 493 166 484 119C479 95 468 79 442 76Z" fill="url(#okra)" stroke="#b3bd6f" stroke-width="2"/>
