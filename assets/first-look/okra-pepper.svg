    <g fill="#f8ebbc" stroke="#b3be7e" stroke-width="2"><ellipse cx="0" cy="-17" rx="9" ry="12"/><ellipse cx="16" cy="-1" rx="9" ry="11" transform="rotate(60 16 -1)"/><ellipse cx="9" cy="18" rx="10" ry="11" transform="rotate(25 9 18)"/><ellipse cx="-13" cy="17" rx="10" ry="12" transform="rotate(-28 -13 17)"/><ellipse cx="-19" cy="-4" rx="10" ry="11" transform="rotate(-66 -19 -4)"/></g>
    <circle cx="0" cy="0" r="6" fill="#f7efcd"/>
  </g>
  <path d="M21 419H285M335 419H599" stroke="#f2d69a" stroke-opacity=".42"/>
