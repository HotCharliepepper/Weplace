name: WEPLACE dual evidence preview QA
on:
  pull_request:
    paths:
      - index.html
      - november-fast-a-r8.html
      - assets/css/evidence-duo-r1.css
      - qa/evidence-duo-r1.py
      - .github/workflows/evidence-duo-r1.yml
permissions:
  contents: read
jobs:
  visual-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Korean fonts and browser
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          python -m pip install playwright==1.56.0
      - name: Start review server
        run: |
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/weplace-evidence.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/weplace-evidence.log; exit 1
      - name: Verify numbers, separation, mobile layout and noJS
        run: python qa/evidence-duo-r1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weplace-evidence-duo-r1
          path: qa/evidence-duo-r1/
          retention-days: 14
          if-no-files-found: warn
