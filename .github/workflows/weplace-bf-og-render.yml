name: Weplace BF OG render
on:
  pull_request:
    paths:
      - 'assets/brand/og-resolute-v-fast.svg'
      - 'assets/campaign/bf-contrarian-r8.svg'
      - '.github/workflows/weplace-bf-og-render.yml'
permissions:
  contents: write
jobs:
  render:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare renderer
        run: pip install 'playwright==1.56.0' Pillow
      - name: Start server
        run: |
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/og-render.log 2>&1 &
          for i in $(seq 1 25); do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/og-render.log; exit 1
      - name: Generate OG-safe PNG for social crawlers
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          from playwright.sync_api import sync_playwright
          assets=[('assets/brand/og-resolute-v-fast.svg','assets/brand/og-resolute-v-fast.png'),('assets/campaign/bf-contrarian-r8.svg','assets/campaign/bf-contrarian-r8.png')]
          css='<style>@font-face{font-family:WeplaceKO;src:url("http://127.0.0.1:4173/assets/ad-funnel-r2a/fonts/WeplaceFunnelSansBold.woff2") format("woff2");font-weight:800 900}html,body{margin:0;width:1200px;height:630px;overflow:hidden}svg{width:1200px;height:630px;display:block}</style>'
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True,channel='chrome')
            page=browser.new_page(viewport={'width':1200,'height':630},device_scale_factor=1)
            page.goto('http://127.0.0.1:4173/',wait_until='domcontentloaded')
            for svg,png in assets:
              page.set_content('<html lang="ko"><head>'+css+'</head><body>'+Path(svg).read_text(encoding='utf-8')+'</body></html>',wait_until='load')
              page.evaluate('document.fonts.ready')
              page.wait_for_timeout(180)
              page.screenshot(path=png,animations='disabled')
              with Image.open(png) as img:
                assert img.size==(1200,630) and img.format=='PNG'
              print('Rendered',png)
            browser.close()
          PY
      - name: Commit generated PNGs on review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/brand/og-resolute-v-fast.png assets/campaign/bf-contrarian-r8.png
          if ! git diff --cached --quiet; then
            git commit -m "assets: render BF share PNGs"
            git push origin HEAD:"${{ github.head_ref }}"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weplace-bf-r8-og
          path: |
            assets/brand/og-resolute-v-fast.png
            assets/campaign/bf-contrarian-r8.png
          if-no-files-found: warn
