name: Weplace FAST OG × Luwei Visual Scene QA
on:
  pull_request:
    paths:
      - index.html
      - assets/brand/og-resolute-fast.svg
      - assets/css/luwei-dwell-r1.css
      - assets/js/luwei-dwell-r1.js
      - assets/home-r42/luwei-peking-duck-*.webp
      - qa/fast-og-luwei-r1.py
      - .github/workflows/fast-og-luwei-r1.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare image renderer, CJK fonts, and browser QA
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends librsvg2-bin fonts-noto-cjk
          python -m pip install Pillow playwright==1.56.0
          (which google-chrome || which google-chrome-stable || which chromium-browser)
      - name: Render FAST social PNG
        run: |
          rsvg-convert -w 1200 -h 630 -o assets/brand/og-resolute-fast.png assets/brand/og-resolute-fast.svg
      - name: Crop only LuWei facade, without people or review UI
        run: |
          git fetch origin refs/heads/draft/weplace-card-depth-selective-r1-20261118:refs/remotes/origin/luwei-source
          git show origin/luwei-source:assets/home-r42/luwei-before-capture.webp > /tmp/luwei-full.webp
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          with Image.open('/tmp/luwei-full.webp') as raw:
              assert raw.size == (908, 689), f'unexpected screenshot dimensions: {raw.size}'
              cropped = raw.convert('RGB').crop((0, 0, 252, 273)).resize((756, 819), Image.Resampling.LANCZOS)
          dest=Path('assets/home-r42/luwei-exterior-crop.webp')
          dest.parent.mkdir(parents=True, exist_ok=True)
          cropped.save(dest,'WEBP',quality=86,method=6)
          print(f'Exterior-only crop saved: {dest}, {cropped.size}')
          PY
          rm /tmp/luwei-full.webp
      - name: Start local review server
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/weplace-luwei-r1.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/weplace-luwei-r1.log; exit 1
      - name: Verify OG image and responsive story
        run: python qa/fast-og-luwei-r1.py
      - name: Commit ONLY derived assets to the review branch
        if: success() && github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/brand/og-resolute-fast.png assets/home-r42/luwei-exterior-crop.webp
          if git diff --cached --quiet; then
            echo 'Generated assets already up to date'
          else
            git commit -m "assets: render FAST OG and privacy-safe LuWei exterior crop"
            git push origin HEAD:draft/weplace-fast-og-luwei-dwell-20261118
          fi
      - name: Save screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WEPLACE-FAST-OG-LUWEI-R1-QA
          path: |
            qa/fast-og-luwei-r1/
          retention-days: 14
          if-no-files-found: warn
