name: Migrate site domain

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate-domain:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace legacy site domains
        run: |
          python - <<'PY'
          from pathlib import Path

          targets = [p for p in Path('.').rglob('*') if p.is_file() and p.suffix.lower() in {'.html', '.md', '.txt'}]
          changed = []
          for p in targets:
              try:
                  s = p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              n = s.replace('https://weplace.netlify.app/', 'https://withweplace.kr/')
              n = n.replace('https://weplace.kr/', 'https://withweplace.kr/')
              if p.as_posix() == 'index.html':
                  if '<meta property="og:url"' not in n:
                      marker = '<meta property="og:description" content="네이버·구글·홈페이지·리뷰·AI 검색에 흩어진 정보를 하나의 매장처럼 읽히게 정리합니다. 매장명 한 줄이면 시작합니다." />'
                      if marker in n:
                          n = n.replace(marker, marker + '\n<meta property="og:url" content="https://withweplace.kr/" />')
                  n = n.replace('<meta property="og:image" content="img/weplace-hero-surface.jpg" />', '<meta property="og:image" content="https://withweplace.kr/img/weplace-hero-surface.jpg" />')
              if n != s:
                  p.write_text(n, encoding='utf-8')
                  changed.append(str(p))
          print('Changed files:')
          print('\n'.join(changed) if changed else '(none)')
          PY
      - name: Commit migration
        run: |
          if git diff --quiet; then
            echo "No domain changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[skip ci] Migrate site URLs to withweplace.kr"
          git push
