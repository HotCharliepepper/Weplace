name: WEPLACE November FAST A R1 QA
on:
  pull_request:
    paths:
      - november-fast-a-r1.html
      - qa/november-fast-a-r1-smoke.py
      - .github/workflows/november-fast-a-r1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  campaign-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare Playwright Chromium
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Launch isolated review server
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/weplace-nov-fast.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/november-fast-a-r1.html > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/weplace-nov-fast.log; exit 1
      - name: Browser QA · visual, interactions, reduced motion and no writes
        run: python qa/november-fast-a-r1-smoke.py
      - name: Preserve screenshots and exact results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WEPLACE-NOV-FAST-A-R1-QA
          path: |
            qa/november-fast-a-r1/
          retention-days: 14
          if-no-files-found: warn
