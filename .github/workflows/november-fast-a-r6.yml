name: WEPLACE November FAST R6 Slide Intake QA
on:
  pull_request:
    paths:
      - november-fast-a-r6.html
      - qa/november-fast-a-r6-smoke.py
      - .github/workflows/november-fast-a-r6.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare Chrome test runtime
        run: |
          python -m pip install playwright==1.56.0
          (which google-chrome || which google-chrome-stable || which chromium-browser)
      - name: Serve review site
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/nov-fast-r6.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/november-fast-a-r6.html > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/nov-fast-r6.log; exit 1
      - name: Test wizard UX and customer handoff
        run: python qa/november-fast-a-r6-smoke.py
      - name: Save actual UI screenshots and exact QA data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WEPLACE-NOVEMBER-FAST-R6-WIZARD-QA
          path: |
            qa/november-fast-a-r6/
          retention-days: 14
          if-no-files-found: warn
