name: Build home massage esthetic prototype

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stop on generated commit
        run: |
          if git log -1 --pretty=%B | grep -q '\[skip ci\]'; then
            echo stop > /tmp/skip
          fi
      - name: Build prototype
        run: |
          if [ -f /tmp/skip ]; then exit 0; fi
          python scripts/build_home_massage_esthetic_prototype.py
          python scripts/postprocess_home_massage_esthetic_prototype.py
      - name: Commit prototype
        run: |
          if [ -f /tmp/skip ]; then exit 0; fi
          if [ -z "$(git status --porcelain -- prototype/home-massage-esthetic/index.html)" ]; then
            echo "No prototype changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prototype/home-massage-esthetic/index.html
          git commit -m "[skip ci] Build home massage esthetic focus prototype"
          git push
