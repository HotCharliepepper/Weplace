name: WEPLACE Hero Evidence Lab R1 review
on:
  pull_request:
    paths:
      - unified-r3-hero-lab.html
      - assets/css/hero-evidence-lab-r1.css
      - assets/js/hero-evidence-lab-r1.js
      - assets/js/unified-r3-hero-lab.js
      - tests/hero-evidence-lab-r1.test.cjs
      - scripts/qa-hero-evidence-lab-r1.cjs
      - .github/workflows/hero-evidence-lab-r1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-review:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Export editable standalone preview patch
        uses: actions/upload-artifact@v4
        with:
          name: WEPLACE-HERO-EVIDENCE-R1-EDITABLE
          path: |
            unified-r3-hero-lab.html
            assets/css/hero-evidence-lab-r1.css
            assets/js/hero-evidence-lab-r1.js
            assets/js/unified-r3-hero-lab.js
            docs/hero-evidence-lab-r1/README.md
          retention-days: 14
          if-no-files-found: error
      - name: Install and verify
        run: |
          npm ci
          npm run verify
      - name: Chromium
        run: |
          browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$browser_path" ]; then
            "$browser_path" --version
            printf 'RV_BROWSER_PATH=%s\n' "$browser_path" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Start review server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/hero-lab.log 2>&1 &
          for n in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/unified-r3-hero-lab.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/hero-lab.log
          exit 1
      - name: Browser QA
        run: |
          node scripts/qa-hero-evidence-lab-r1.cjs
          node scripts/qa-evidence-inflow-seasonality-r1.cjs
      - name: Upload screenshot + QA results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WEPLACE-HERO-EVIDENCE-R1-QA
          path: test-results/
          retention-days: 14
          if-no-files-found: warn
