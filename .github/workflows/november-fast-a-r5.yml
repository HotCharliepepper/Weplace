name: WEPLACE November FAST R5 Natural Korean QA
on:
  pull_request:
    paths:
      - november-fast-a-r5.html
      - qa/november-fast-a-r5-smoke.py
      - .github/workflows/november-fast-a-r5.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  campaign-copy-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare Chrome and playwright
        run: |
          python -m pip install playwright==1.56.0
          (which google-chrome || which google-chrome-stable || which chromium-browser)
      - name: Launch read-only source preview
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/november-r5.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/november-fast-a-r5.html > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/november-r5.log
          exit 1
      - name: Test edited Korean copy and original interactions
        run: python qa/november-fast-a-r5-smoke.py
      - name: Preserve mobile/desktop screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WEPLACE-NOVEMBER-FAST-R5-COPY-QA
          path: |
            qa/november-fast-a-r5/
          retention-days: 14
          if-no-files-found: warn
