name: Unified R3 preview QA
on:
  pull_request:
    paths:
      - unified-r3.html
      - assets/css/unified-r3*.css
      - assets/js/unified-r3.js
      - assets/unified-r3/**
      - review/unified-r3.html
      - tests/unified-r3.test.cjs
      - scripts/qa-unified-r3.cjs
      - .github/workflows/unified-r3-review.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install and verify
        run: |
          mkdir -p test-results/unified-r3
          npm ci 2>&1 | tee test-results/unified-r3/npm-ci.log
          npm run verify 2>&1 | tee test-results/unified-r3/verify.log
      - name: Select Chromium
        run: |
          browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$browser_path" ]; then
            "$browser_path" --version
            printf 'RV_BROWSER_PATH=%s\n' "$browser_path" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Serve review build
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist > /tmp/unified-server.log 2>&1 &
          for n in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/unified-r3.html >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Chromium flows, fallbacks, screenshots and performance
        run: node scripts/qa-unified-r3.cjs
      - name: Existing page regression
        if: always()
        run: |
          node scripts/qa-resolute.cjs
          node scripts/qa-resolute-depth-r2.cjs
      - name: Preserve QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WEPLACE-UNIFIED-R3-QA
          path: test-results/
          retention-days: 30
          if-no-files-found: warn
