name: WEPLACE Hero Evidence Polish R3 QA
on:
  pull_request:
    paths:
      - unified-r3-hero-polish-r3.html
      - assets/css/hero-evidence-polish-r3*.css
      - tests/hero-evidence-polish-r3.test.cjs
      - scripts/qa-hero-evidence-polish-r3.cjs
      - scripts/qa-full-site-navigation.cjs
      - site.html
      - essay.html
      - webtoon/index.html
      - .github/workflows/hero-evidence-polish-r3.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-review:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build and test
        run: |
          npm ci
          npm run verify
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Serve reviewed artifact
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist > /tmp/hero-r3.log 2>&1 &
          for n in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/unified-r3-hero-polish-r3.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/hero-r3.log
          exit 1
      - name: R3 browser QA and R2 regression
        run: |
          node scripts/qa-hero-evidence-polish-r3.cjs
          node scripts/qa-hero-evidence-polish-r2.cjs
      - name: Full-site editorial browser QA
        run: node scripts/qa-full-site-navigation.cjs
      - name: Preserve screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WEPLACE-HERO-EVIDENCE-POLISH-R3-QA
          path: |
            docs/hero-evidence-polish-r3/browser/
            docs/full-site-launch/browser/
            test-results/
          retention-days: 14
          if-no-files-found: warn
