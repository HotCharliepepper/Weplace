name: WEPLACE Unified Main R1 Public-Safe QA
on:
  pull_request:
    paths:
      - index.html
      - assets/css/**
      - assets/js/**
      - assets/vendor/**
      - assets/brand/**
      - qa/unified-main-safe-r1.py
      - .github/workflows/unified-main-safe-r1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cinematic-home:
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare Chrome test runtime
        run: |
          python -m pip install playwright==1.56.0
          (which google-chrome || which google-chrome-stable || which chromium-browser)
      - name: Serve isolated full site
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/weplace-unified-main.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/weplace-unified-main.log; exit 1
      - name: Browser QA · reference experience, CTA, protected routes, accessibility
        run: python qa/unified-main-safe-r1.py
      - name: Keep screenshots and exact QA JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WEPLACE-UNIFIED-MAIN-R1-QA
          path: |
            qa/unified-main-safe-r1/
          retention-days: 14
          if-no-files-found: warn
