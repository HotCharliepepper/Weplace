name: FAST Text Depth R2 preview QA
on:
  pull_request:
    paths:
      - unified-r3-text-depth.html
      - assets/css/fast-text-depth-r2.css
      - tests/fast-text-depth-r2.test.cjs
      - scripts/qa-fast-text-depth-r2.cjs
      - .github/workflows/fast-text-depth-r2-review.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Review build / tests / links
        run: |
          npm ci
          npm run verify
      - name: Select Chromium
        run: |
          browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$browser_path" ]; then
            "$browser_path" --version
            printf 'RV_BROWSER_PATH=%s\n' "$browser_path" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Serve review build
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/fast-depth-server.log 2>&1 &
          for n in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/unified-r3-text-depth.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/fast-depth-server.log
          exit 1
      - name: Sunwind and optical depth regression
        run: |
          node scripts/qa-fast-sunwind-r1.cjs
          node scripts/qa-fast-text-depth-r2.cjs
      - name: Save screenshots and results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WEPLACE-FAST-TEXT-DEPTH-R2
          path: test-results/
          retention-days: 14
          if-no-files-found: warn
