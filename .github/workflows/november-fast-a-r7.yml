name: WEPLACE November FAST R7 Focused Campaign QA
on:
  pull_request:
    paths:
      - november-fast-a-r7.html
      - qa/november-fast-a-r7-smoke.py
      - .github/workflows/november-fast-a-r7.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  campaign-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright with runner Chrome
        run: |
          python -m pip install playwright==1.56.0
          (which google-chrome || which google-chrome-stable || which chromium-browser)
      - name: Launch review server
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/nov-r7.log 2>&1 &
          for n in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/november-fast-a-r7.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/nov-r7.log
          exit 1
      - name: Validate visual comparisons and conversion flow
        run: python qa/november-fast-a-r7-smoke.py
      - name: Retain actual rendered screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WEPLACE-NOVEMBER-FAST-R7-QA
          path: |
            qa/november-fast-a-r7/
          retention-days: 14
          if-no-files-found: warn
