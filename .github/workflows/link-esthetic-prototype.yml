name: Link esthetic prototype

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  link-prototype:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link esthetic page from main and industries hub
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          main = Path('index.html')
          s = main.read_text(encoding='utf-8')
          s = s.replace('href="industries/spa.html"', 'href="/industries/esthetic/"')
          s = s.replace('alt="마사지·에스테틱"', 'alt="에스테틱·페이셜케어"')
          s = s.replace('<div class="field__name">마사지 · 에스테틱</div>', '<div class="field__name">에스테틱 · 페이셜</div>')
          s = s.replace('가격보다 먼저, 괜찮은 곳인지 확인받고 싶어 합니다.', '관리를 고르기 전에, 이해하고 예약할 수 있는지부터 봅니다.')
          main.write_text(s, encoding='utf-8')

          hub = Path('industries/index.html')
          h = hub.read_text(encoding='utf-8')
          if '/industries/esthetic/' not in h:
              marker = '      <a class="hcard" href="/industries/restaurant/">'
              card = '''      <a class="hcard" href="/industries/esthetic/">\n        <span class="hcard__no">02</span>\n        <span class="hcard__t">에스테틱 · 페이셜케어</span>\n        <span class="hcard__stop">관리 자체보다 먼저, "무엇을 받고 얼마가 들고 어떻게 예약하는지"를 이해할 수 있는지에서 멈춥니다.</span>\n        <span class="hcard__go">자세히 보기 →</span>\n      </a>\n'''
              h = h.replace(marker, card + marker, 1)
          for href, no in [
              ('/industries/restaurant/','03'),
              ('/industries/massage/','04'),
              ('/industries/stay/','05'),
              ('/industries/clinic/','06')]:
              pattern = r'(<a class="hcard" href="'+re.escape(href)+r'">.*?<span class="hcard__no">)\d+(</span>)'
              h = re.sub(pattern, r'\g<1>'+no+r'\2', h, count=1, flags=re.S)
          h = h.replace('<meta name="last-modified" content="2026-06-03" />','<meta name="last-modified" content="2026-08-28" />')
          h = h.replace('업종별 페이지는 순차적으로 엽니다 · 정보 갱신일 2026-06-03','업종별 페이지는 순차적으로 엽니다 · 정보 갱신일 2026-08-28')
          h = h.replace('정보 갱신일 2026-06-03 · © We Place','정보 갱신일 2026-08-28 · © We Place')
          hub.write_text(h, encoding='utf-8')
          PY
      - name: Commit linked prototype
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html industries/index.html
          git commit -m "[skip ci] Link esthetic prototype into site flow"
          git push
