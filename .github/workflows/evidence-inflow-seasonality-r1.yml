name: WEPLACE Evidence R1 review
on:
  pull_request:
    paths:
      - unified-r3-evidence.html
      - assets/css/evidence-inflow-seasonality-r1.css
      - tests/evidence-inflow-seasonality-r1.test.cjs
      - scripts/qa-evidence-inflow-seasonality-r1.cjs
      - .github/workflows/evidence-inflow-seasonality-r1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: npm install / code test / static link verify / build
        run: |
          npm ci
          npm run verify
      - name: Use Chromium
        run: |
          browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$browser_path" ]; then
            "$browser_path" --version
            printf 'RV_BROWSER_PATH=%s\n' "$browser_path" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Start local read-only review server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist > /tmp/evi-review.log 2>&1 &
          for n in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/unified-r3-evidence.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/evi-review.log
          exit 1
      - name: Evidence charts and R3 preserved interactions
        run: |
          node scripts/qa-evidence-inflow-seasonality-r1.cjs
          node scripts/qa-fast-text-depth-r2.cjs
      - name: Capture review results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WEPLACE-EVIDENCE-R1-QA
          path: test-results/
          retention-days: 14
          if-no-files-found: warn
