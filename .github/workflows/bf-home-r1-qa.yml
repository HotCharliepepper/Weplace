name: WEPLACE BF Home Inflow and Footer QA
on:
  pull_request:
    paths:
      - index.html
      - november-fast-a-r8.html
      - assets/css/november-home-inflow-r1.css
      - qa/bf-home-r1-smoke.py
      - .github/workflows/bf-home-r1-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-and-links:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Browser runtime and Korean fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          python -m pip install playwright==1.56.0
          (which google-chrome || which google-chrome-stable || which chromium-browser)
      - name: Start isolated review web server
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/weplace-bf-home-r1.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/weplace-bf-home-r1.log
          exit 1
      - name: Validate source, links, visual responsive and basic interactions
        run: python qa/bf-home-r1-smoke.py
      - name: Preserve QA screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weplace-bf-home-r1-qa
          path: qa/bf-home-r1/
          retention-days: 14
          if-no-files-found: warn
