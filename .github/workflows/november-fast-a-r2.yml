name: WEPLACE November FAST A R2 QA
on:
  pull_request:
    paths:
      - november-fast-a-r2.html
      - qa/november-fast-a-r2-smoke.py
      - .github/workflows/november-fast-a-r2.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  campaign-r2-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare hosted Chrome and Playwright
        run: |
          python -m pip install playwright==1.56.0
          (which google-chrome || which google-chrome-stable || which chromium-browser)
      - name: Serve static review site
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/weplace-nov-r2.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/november-fast-a-r2.html > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/weplace-nov-r2.log; exit 1
      - name: Chrome QA — story and conversion flow
        run: python qa/november-fast-a-r2-smoke.py
      - name: Preserve results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WEPLACE-NOV-FAST-A-R2-QA
          path: |
            qa/november-fast-a-r2/
          retention-days: 14
          if-no-files-found: warn
