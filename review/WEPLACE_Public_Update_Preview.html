m{min-height:0}.price-card{padding:28px}.language-switch{gap:4px}.header-inner{gap:12px}.price-amount{font-size:36px}.en-page .micro-grid{grid-template-columns:1fr 1fr}.en-page .stage-panel b{font-size:12px}.en-page .hero-stage{min-height:490px}.en-page .stage-body h3{font-size:27px}}\n@media(max-width:480px){.header .nav-cta{display:none}.language-switch{font-size:11px}.research-stat{font-size:47px}.research-panel h3{font-size:23px}.en-page .floating-tip{max-width:245px;font-size:12px}.en-page .mobile-sticky span{font-size:11px}.en-page .mobile-sticky a{font-size:12px}.en-page .hero-grid{gap:25px}}\n<\/style>\n<\/head>\n<body>\n<a class=\"skip\" href=\"#main\">본문으로 건너뛰기<\/a>\n<div id=\"readProgress\" class=\"progress\" aria-hidden=\"true\"><\/div>\n<header id=\"siteHeader\" class=\"header\">\n <div class=\"wrap header-inner\">\n  <a href=\"#top\" class=\"brand\" aria-label=\"Weplace 홈페이지 첫 화면\"><span class=\"brand-mark\" aria-hidden=\"true\"><\/span><span>We,<em>place.<\/em><\/span><\/a>\n  <nav id=\"mainNav\" class=\"nav-links\" aria-label=\"주요 메뉴\"><a href=\"#journey\">손님은 어떻게 고를까<\/a><a href=\"#experience\">직접 살펴보기<\/a><a href=\"#research\">AI·외국인 고객<\/a><a href=\"#services\">서비스·가격<\/a><a href=\"https://withweplace.kr/field-notes/\">작업·변화 기록<\/a><a class=\"nav-team\" href=\"https://withweplace.kr/client\">대표님 공간 ↗<\/a><\/nav>\n  <div class=\"language-switch\" aria-label=\"Language\"><span lang=\"ko\" aria-current=\"page\">한국어<\/span><a lang=\"en\" hreflang=\"en\" href=\"https://withweplace.kr/en/\">EN<\/a><\/div>\n  <a href=\"#contact\" class=\"nav-cta\" data-lead=\"header\">1장 진단 문의 ↗<\/a>\n  <button type=\"button\" id=\"menuBtn\" class=\"nav-btn\" aria-label=\"메뉴 열기\" aria-expanded=\"false\" aria-controls=\"mainNav\">☰<\/button>\n <\/div>\n<\/header>\n<main id=\"main\">\n<section class=\"hero\" id=\"top\">\n<div class=\"wrap hero-grid\">\n <div>\n  <div class=\"eyebrow\">WEPLACE · HUMAN-FIRST LOCAL EXPERIENCE<\/div>\n  <h1>좋은 매장인데,<br>손님은 <em>어디에서<br>망설일까요?<\/em><\/h1>\n  <p class=\"lede\">사진을 보고, 리뷰를 읽고, 가격을 비교하고, 한 번 더 검색합니다. 위플레이스는 손님이 안심하고 선택할 수 있도록 그 사이의 화면을 정리합니다.<\/p>\n  <div class=\"hero-actions\"><a class=\"button button-dark\" href=\"#experience\" data-intent=\"hero_experience\">손님 입장에서 체험하기 <span aria-hidden=\"true\">↗<\/span><\/a><a class=\"button button-light\" href=\"#industries\">우리 업종 찾아보기 <span aria-hidden=\"true\">↘<\/span><\/a><\/div>\n  <div class=\"hero-rule\"><span><\/span>순위보다 먼저, 선택의 이유를 살펴봅니다.<\/div>\n <\/div>\n <div class=\"hero-stage\" aria-label=\"고객이 보고 싶어 하는 매장 정보 구성의 예시\">\n  <div class=\"hero-note\">FROM INFORMATION TO CONFIDENCE<\/div>\n  <div class=\"stage-card\">\n    <div class=\"stage-top\"><div class=\"dots\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div><span class=\"stage-url\">CUSTOMER VIEW · EXAMPLE<\/span><\/div>\n    <div class=\"stage-body\"><div class=\"stage-tag\">고객에게 먼저 필요한 것<\/div><h3>괜찮아 보이는데,<br><strong>내가 가도 편할까?<\/strong><\/h3><div class=\"stage-panel\"><div><span>01. 정보<\/span><b>가격이 명확한가<\/b><\/div><div><span>02. 경험<\/span><b>사진과 실제가 같은가<\/b><\/div><div><span>03. 행동<\/span><b>예약이 쉬운가<\/b><\/div><\/div><div class=\"stage-footer\">한 번 더 검색하지 않아도, 답을 찾을 수 있도록.<\/div><\/div>\n  <\/div>\n  <div class=\"floating-tip\"><span>WEPLACE INSIGHT<\/span>고객은 매장의 모든 것을 알 필요가 없습니다. <b>지금 궁금한 것을<\/b> 알면 됩니다.<\/div>\n <\/div>\n<\/div>\n<\/section>\n<div class=\"micro-band\"><div class=\"wrap micro-grid\" aria-label=\"고객이 매장을 선택하는 네 단계\"><div><b>01<\/b> 발견하는 순간<\/div><div><b>02<\/b> 다시 확인하는 순간<\/div><div><b>03<\/b> 안심하는 순간<\/div><div><b>04<\/b> 방문을 결정하는 순간<\/div><\/div><\/div>\n<section class=\"section\" id=\"journey\"><div class=\"wrap journey-grid\"><div class=\"journey-intro\"><div class=\"eyebrow\">HOW PEOPLE REALLY CHOOSE<\/div><h2>방문은 매장 앞이 아니라,<br>검색 화면에서<br>시작됩니다.<\/h2><p>대표님은 매장을 알고 있지만, 처음 보는 고객은 몇 장의 화면만 가지고 판단합니다. 그 사이에서 어떤 질문이 생기고, 어디서 다시 확인하는지 살펴봅니다.<\/p><\/div><div class=\"journey-steps\"><div class=\"journey-step\"><span class=\"journey-n\">01<\/span><div><h3>발견<\/h3><p>이 매장이 어떤 곳인지, 내 목적에 맞는지 알아봅니다.<\/p><\/div><\/div><div class=\"journey-step\"><span class=\"journey-n\">02<\/span><div><h3>확인<\/h3><p>사진·위치·가격·리뷰가 같은 이야기를 하는지 확인합니다.<\/p><\/div><\/div><div class=\"journey-step\"><span class=\"journey-n\">03<\/span><div><h3>안심<\/h3><p>실패할 가능성이 낮아졌다고 느낄 근거를 찾습니다.<\/p><\/div><\/div><div class=\"journey-step\"><span class=\"journey-n\">04<\/span><div><h3>행동<\/h3><p>전화, 예약, 길찾기 중 가장 편한 다음 행동을 선택합니다.<\/p><\/div><\/div><\/div><\/div><\/section>\n<section class=\"section lens-section\" id=\"experience\"><div class=\"wrap lens-grid\"><div class=\"lens-controls\"><div class=\"eyebrow\">TRY IT YOURSELF · 30-SECOND EXPLORER<\/div><h2>손님의 머릿속으로<br>잠깐 들어가 보세요.<\/h2><p class=\"lede\">업종을 선택하면 고객이 방문 전에 자주 확인하는 질문이 바뀝니다. 정답을 정해 두는 대신, 대표님 매장이라면 어떤 답이 먼저 보여야 할지 생각해 보세요.<\/p><div class=\"lens-choices\" role=\"group\" aria-label=\"업종 선택\"><button type=\"button\" class=\"choice\" data-industry=\"dining\" aria-pressed=\"true\">식당 · 카페<\/button><button type=\"button\" class=\"choice\" data-industry=\"stay\" aria-pressed=\"false\">호텔 · 숙소<\/button><button type=\"button\" class=\"choice\" data-industry=\"beauty\" aria-pressed=\"false\">뷰티 · 케어<\/button><button type=\"button\" class=\"choice\" data-industry=\"general\" aria-pressed=\"false\">그 외 업종<\/button><\/div><p class=\"fine\" style=\"margin-top:18px\">업종별 대표적인 질문을 이해하기 위한 예시입니다. 실제 고객 조사 결과를 의미하지는 않습니다.<\/p><\/div><div class=\"lens-output\" aria-live=\"polite\" aria-atomic=\"true\"><div class=\"lens-header\"><span>손님의 첫 질문<\/span><span id=\"lensLabel\">DINING EXPERIENCE<\/span><\/div><div class=\"lens-screen\"><div class=\"question-label\">손님이라면, 이렇게 묻습니다.<\/div><h3 id=\"lensQuestion\">“오늘 가도 자리 있을까?<br>메뉴와 가격은 어떨까?”<\/h3><p class=\"question-sub\" id=\"lensDescription\">가격·메뉴·영업시간·웨이팅 정보를 한 번에 알 수 있으면 다시 검색할 이유가 줄어듭니다.<\/p><div class=\"lens-signals\"><div><span>먼저 필요한 정보<\/span><strong id=\"lensSignal1\">메뉴와 가격<\/strong><\/div><div><span>안심을 주는 단서<\/span><strong id=\"lensSignal2\">최근 사진과 리뷰<\/strong><\/div><\/div><\/div><div class=\"lens-bottom\"><span class=\"lens-disclaimer\">Weplace · 고객 관점 예시<\/span><a id=\"lensLink\" class=\"button button-dark\" href=\"https://withweplace.kr/industries/dining.html\">해당 업종 살펴보기 ↗<\/a><\/div><\/div><\/div><\/section>\n<section class=\"section\" id=\"difference\"><div class=\"wrap\"><div class=\"section-head\"><div><div class=\"eyebrow\">BEFORE / AFTER · CONCEPT EXAMPLE<\/div><h2>똑같은 매장도<br>화면의 순서가 다르면 다르게 읽힙니다.<\/h2><\/div><p class=\"lede\" style=\"font-size:16px;max-width:320px\">가치가 없어서가 아니라, 지금 필요한 정보가 보이지 않아 망설이는 경우가 있습니다.<\/p><\/div><div class=\"compare-grid\"><article class=\"compare-card\"><header><span>BEFORE · 다시 검색하게 되는 화면<\/span><small>가상 예시<\/small><\/header><div class=\"compare-mock\"><div class=\"mock-name\">아늑한 공간에서 특별한 시간<\/div><div class=\"mock-photo mock-photo--before\">\n  <img src=\"https://withweplace.kr/img/ind-dining.jpg\" alt=\"같은 식당 공간을 보여주는 정보 구성 비교용 참고 사진\" loading=\"lazy\" decoding=\"async\" width=\"1122\" height=\"1402\">\n  <span class=\"mock-image-caption\">사진만 있고 설명은 부족한 화면<\/span>\n  <div class=\"mock-chips\" aria-label=\"고객이 추가로 검색해야 하는 질문\"><span>가격은?<\/span><span>주차는?<\/span><span>영업시간은?<\/span><\/div>\n<\/div><div class=\"mock-lines\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div><p class=\"fine\" style=\"margin-top:18px\">가격이 어디 있지? 주차가 될까? 사진은 언제 찍은 걸까?<\/p><\/div><p class=\"compare-copy\">말은 좋지만 <b>나에게 필요한 사실<\/b>을 다시 찾아야 합니다.<\/p><\/article><article class=\"compare-card good\"><header><span>AFTER · 바로 이해되는 화면<\/span><small>가상 예시<\/small><\/header><div class=\"compare-mock\"><div class=\"mock-name\">이용 전 꼭 확인할 세 가지<\/div><div class=\"mock-photo mock-photo--after\">\n  <img src=\"https://withweplace.kr/img/ind-dining.jpg\" alt=\"앞의 예시와 같은 식당 공간 참고 사진으로, 정보가 정리된 화면을 비교\" loading=\"lazy\" decoding=\"async\" width=\"1122\" height=\"1402\">\n  <span class=\"mock-image-caption\">사진과 필요한 정보가 한 화면에<\/span>\n  <div class=\"mock-chips\" aria-label=\"한눈에 확인할 수 있는 정보\"><span>메뉴·가격<\/span><span>운영시간<\/span><span>주차·예약<\/span><\/div>\n<\/div><div class=\"mock-lines\"><span>✓ 가격 및 이용 기준을 첫 화면에<\/span><span>✓ 최근 사진과 실제 공간 안내<\/span><span>✓ 주차·위치·예약 방법을 한곳에<\/span><\/div><p class=\"fine\" style=\"margin-top:18px\">찾던 정보가 보여, 다음 행동을 고를 수 있습니다.<\/p><\/div><p class=\"compare-copy\">고객이 <b>안심하고 판단할 근거<\/b>를 빠르게 찾습니다.<\/p><\/article><\/div><p class=\"compare-footnote\">* 위 화면은 정보 구조를 설명하기 위한 제작 예시이며, 특정 매장의 실제 전환 결과가 아닙니다.<\/p><\/div><\/section>\n<section class=\"section industries\" id=\"industries\"><div class=\"wrap\"><div class=\"section-head\"><div><div class=\"eyebrow\">INDUSTRY EXPERIENCE SYSTEMS<\/div><h2>업종마다 고객의<br>망설임은 다릅니다.<\/h2><\/div><p class=\"lede\" style=\"font-size:16px;max-width:330px\">같은 방식의 광고가 아니라, 각각의 업종에서 고객이 필요로 하는 정보를 먼저 살펴봅니다.<\/p><\/div><div class=\"industry-grid\"><a class=\"industry-card\" href=\"https://withweplace.kr/industries/dining.html\" data-sector=\"dining\"><div class=\"industry-img\"><img src=\"https://withweplace.kr/img/ind-dining.jpg\" alt=\"식당에서 음식과 공간을 경험하는 장면\" loading=\"lazy\"><\/div><div class=\"industry-copy\"><div class=\"eyebrow\">FOOD & DINING<\/div><h3>식당 · 카페<\/h3><p>가격, 메뉴, 분위기부터 방문 결정까지. 손님이 다시 확인하는 일을 줄입니다.<\/p><div class=\"industry-foot\"><span>고객유입 시스템 보기<\/span><span aria-hidden=\"true\">↗<\/span><\/div><\/div><\/a><a class=\"industry-card\" href=\"https://withweplace.kr/industries/stay.html\" data-sector=\"stay\"><div class=\"industry-img\"><img src=\"https://withweplace.kr/img/ind-stay.jpg\" alt=\"숙소 공간과 침구, 객실 분위기\" loading=\"lazy\"><\/div><div class=\"industry-copy\"><div class=\"eyebrow\">STAY & HOSPITALITY<\/div><h3>호텔 · 숙소<\/h3><p>객실·주차·도착·예약 안내를 연결해 낯선 여행지에서도 선택하기 쉽게 만듭니다.<\/p><div class=\"industry-foot\"><span>고객유입 시스템 보기<\/span><span aria-hidden=\"true\">↗<\/span><\/div><\/div><\/a><a class=\"industry-card\" href=\"https://withweplace.kr/industries/beauty/\" data-sector=\"beauty\"><div class=\"industry-img\"><img src=\"https://withweplace.kr/img/ind-beauty.jpg\" alt=\"뷰티 공간의 차분한 인테리어\" loading=\"lazy\"><\/div><div class=\"industry-copy\"><div class=\"eyebrow\">BEAUTY & CARE<\/div><h3>뷰티 · 케어<\/h3><p>결과에 대한 기대와 불안을 함께 이해하는 사진, 설명, 예약의 흐름을 정리합니다.<\/p><div class=\"industry-foot\"><span>업종별 관점 보기<\/span><span aria-hidden=\"true\">↗<\/span><\/div><\/div><\/a><\/div><p class=\"fine\" style=\"margin-top:18px\">숙박·요식업 페이지에는 콘셉트 이미지, 출처를 밝힌 공공 통계, 가정값 기반 계산기와 자가진단이 포함됩니다. 실제 매장 사례 또는 실적을 의미하지 않습니다.<\/p><\/div><\/section>\n<section class=\"section\" id=\"how\"><div class=\"wrap\"><div class=\"section-head\"><div><div class=\"eyebrow\">HOW WE WORK<\/div><h2>감각을 진단하고,<br>작업을 구조로 남깁니다.<\/h2><\/div><p class=\"lede\" style=\"font-size:16px;max-width:340px\">좋아 보이는 화면을 만드는 데서 끝나지 않습니다. 다음 사람도 같은 기준으로 관리할 수 있도록 정리합니다.<\/p><\/div><div class=\"process-grid\"><div class=\"process-card\"><span class=\"num\">STEP 01 / OBSERVE<\/span><h3>현재 화면 관찰<\/h3><p>홈페이지, 네이버, 구글, 리뷰, 사진에서 고객이 멈추는 장면을 기록합니다.<\/p><\/div><div class=\"process-card\"><span class=\"num\">STEP 02 / PRIORITIZE<\/span><h3>작업 우선순위<\/h3><p>불일치, 빠진 정보, 예약 전 질문을 찾고 먼저 바꿀 부분을 합의합니다.<\/p><\/div><div class=\"process-card\"><span class=\"num\">STEP 03 / BUILD<\/span><h3>표면 개선 실행<\/h3><p>사진, 설명, 메뉴·가격, FAQ, 위치 안내, 문의·예약 흐름을 정돈합니다.<\/p><\/div><div class=\"process-card\"><span class=\"num\">STEP 04 / LEARN<\/span><h3>실제 반응 확인<\/h3><p>노출이 아닌 전화·길찾기·문의·예약 등 확인 가능한 행동을 살펴봅니다.<\/p><\/div><\/div><div class=\"result-banner\"><div><h3>성과를 과장하지 않고, 달라진 화면과 행동을 기록합니다.<\/h3><p>진단서 · 실행 체크리스트 · 수정 이력 · 측정 기준을 남겨 다음 개선의 근거로 사용합니다.<\/p><\/div><a href=\"#audit\" class=\"linkline\">내 매장부터 살펴보기 ↗<\/a><\/div><\/div><\/section>\n<section class=\"section audit-section\" id=\"audit\"><div class=\"wrap\"><div class=\"audit-head\"><div><div class=\"eyebrow\">QUICK AUDIT · SELF CHECK<\/div><h2>우리 매장의 첫 화면,<br>손님이 덜 헤매게 돕고 있을까요?<\/h2><p class=\"lede\">확신할 수 있는 항목을 선택해 보세요. 점수보다 중요한 것은 아직 확인하지 못한 고객의 질문입니다.<\/p><\/div><a href=\"#contact\" class=\"button button-outline\" style=\"color:#f2f8f1;border-color:#799b84\">전문 진단 문의 ↗<\/a><\/div><div class=\"audit-box\"><span class=\"audit-counter\">6 SIGNALS OF CUSTOMER CONFIDENCE<\/span><div class=\"audit-options\" id=\"auditOptions\" role=\"group\" aria-label=\"매장 온라인 정보 점검 항목\"><button type=\"button\" class=\"audit-opt\" aria-pressed=\"false\" data-audit=\"최근 사진\"><b aria-hidden=\"true\">✓<\/b>대표사진이 현재 모습과 같습니다<\/button><button type=\"button\" class=\"audit-opt\" aria-pressed=\"false\" data-audit=\"가격\"><b aria-hidden=\"true\">✓<\/b>가격·메뉴·이용 기준이 명확합니다<\/button><button type=\"button\" class=\"audit-opt\" aria-pressed=\"false\" data-audit=\"주차와 위치\"><b aria-hidden=\"true\">✓<\/b>주차·위치·방문 안내가 있습니다<\/button><button type=\"button\" class=\"audit-opt\" aria-pressed=\"false\" data-audit=\"정보 일치\"><b aria-hidden=\"true\">✓<\/b>플랫폼마다 주요 정보가 같습니다<\/button><button type=\"button\" class=\"audit-opt\" aria-pressed=\"false\" data-audit=\"리뷰\"><b aria-hidden=\"true\">✓<\/b>최근 리뷰와 답변을 관리합니다<\/button><button type=\"button\" class=\"audit-opt\" aria-pressed=\"false\" data-audit=\"예약 동선\"><b aria-hidden=\"true\">✓<\/b>예약·문의 방법을 쉽게 찾습니다<\/button><\/div><div class=\"audit-status\" aria-live=\"polite\"><div class=\"audit-result\"><strong id=\"auditMessage\">아는 것부터 확인해 보세요.<\/strong><p id=\"auditHint\">선택하지 않은 항목이 자동으로 문제라는 뜻은 아닙니다.<\/p><\/div><div class=\"audit-score\" id=\"auditScore\">0 / 6<\/div><\/div><\/div><p class=\"audit-foot\">자가점검은 공식 평가나 실제 매장 진단이 아닙니다. 판단이 어려운 항목은 위플레이스와 함께 확인할 수 있습니다.<\/p><\/div><\/section>\n<!-- MARKET UPDATE START --><section class=\"section research-section\" id=\"research\"><div class=\"wrap\">\n<div class=\"eyebrow\">SEARCH & INTERNATIONAL GUESTS<\/div><h2>검색하는 방식이 달라져도,<br>손님이 확인할 사실은 남습니다.<\/h2>\n<p class=\"lede\" style=\"margin-top:24px\">AI가 요약하든, 여행자가 영어로 찾든. 우리 매장의 가격·사진·위치·예약 방법이 같은 이야기를 하고 있을까요?<\/p>\n<div class=\"research-grid\">\n<article class=\"research-panel\"><div class=\"research-meta\">KOREA · 2024 ANNUAL DATA<\/div><h3>외국인에게도<br>선택할 근거가 보이도록.<\/h3><div class=\"research-stat\">1,637<small>만 명<\/small><\/div><div class=\"subtle\">2024년 한국을 방문한 외래관광객 · 약 1,637만 명<\/div><p>문화체육관광부 발표 기준, 2019년 방문객 규모의 <strong>93.5%<\/strong>입니다. 전국 시장의 크기를 보여주는 수치이며, 특정 상권의 수요나 매장 매출을 뜻하지 않습니다.<\/p><div class=\"market-note\"><strong>우리 매장에서 확인할 것<\/strong><br>지역·국적별 방문과 소비 → 필요한 언어 → 메뉴·가격·길찾기 → 실제 문의와 방문<\/div><p class=\"research-source\">출처: <a href=\"https://www.mcst.go.kr/english/policy/pressView.jsp?pSeq=554\" target=\"_blank\" rel=\"noopener noreferrer\">문화체육관광부, 2025.10.24 발표<\/a> · 2024년 연간 통계. 최신 연도 실적으로 표시하지 않습니다. 지역별 분석은 <a href=\"https://datalab.visitkorea.or.kr/datalab/portal/nat/getForTourForm.do\" target=\"_blank\" rel=\"noopener noreferrer\">한국관광 데이터랩<\/a>의 기간·지역·집계 기준을 확인해 별도로 진행합니다.<\/p><\/article>\n<article class=\"research-panel\"><div class=\"research-meta\">U.S. GOOGLE SEARCH · MARCH 2025<\/div><h3>클릭 이전에도<br>정보가 읽히는 검색 환경.<\/h3><p>미국 성인 900명의 검색 행동 분석에서, 일반 검색결과 링크를 클릭한 비율은 다음과 같았습니다.<\/p><figure class=\"market-bars\" aria-label=\"일반 검색결과 링크 클릭 비율. AI 요약 있는 경우 8%, 없는 경우 15%. 0에서 20%까지 동일 축.\"><div class=\"market-bar-label\"><span>AI 요약 있음<\/span><strong>8%<\/strong><\/div><div class=\"market-track\" aria-hidden=\"true\"><div class=\"market-fill\" style=\"width:40%\"><\/div><\/div><div class=\"market-bar-label\"><span>AI 요약 없음<\/span><strong>15%<\/strong><\/div><div class=\"market-track\" aria-hidden=\"true\"><div class=\"market-fill secondary\" style=\"width:75%\"><\/div><\/div><div class=\"market-axis\" aria-hidden=\"true\"><span>0%<\/span><span>10%<\/span><span>20%<\/span><\/div><\/figure><p class=\"research-source\">출처: <a href=\"https://www.pewresearch.org/short-reads/2025/07/22/google-users-are-less-likely-to-click-on-links-when-an-ai-summary-appears-in-the-results/\" target=\"_blank\" rel=\"noopener noreferrer\">Pew Research Center, 2025.07.22<\/a>. 미국 성인 900명, 2025년 3월 검색 행동과 4월 재수집 검색결과 분석. 한국 고객이나 모든 AI 서비스에 그대로 적용할 수 없으며, 인과관계를 입증한 실험은 아닙니다.<\/p><div class=\"market-note\"><strong>위플레이스의 해석<\/strong><br>홈페이지에 들어오기 전에도 이해할 수 있도록, 주요 사실과 방문 전 질문의 답을 일관되게 정리합니다.<\/div><\/article>\n<\/div>\n<div class=\"research-actions\"><article class=\"research-action\"><h3>01. 같은 사실<\/h3><p>홈페이지·네이버 플레이스·Google Business Profile의 상호, 운영시간, 위치, 서비스 정보를 맞춥니다.<\/p><\/article><article class=\"research-action\"><h3>02. 읽을 수 있는 답<\/h3><p>가격·메뉴·예약 조건·FAQ를 텍스트로 정리하고 필요한 언어로 제공합니다. 사진 속 글자에만 중요한 사실을 맡기지 않습니다.<\/p><\/article><article class=\"research-action\"><h3>03. 확인할 수 있는 변화<\/h3><p>노출, 문의 클릭, 실제 문의, 예약을 구분해 기록합니다. 클릭을 매출로 바꾸어 설명하지 않습니다.<\/p><\/article><\/div>\n<p class=\"research-source\">Google은 AI 검색에도 기존 SEO 기본 원칙이 적용되며 별도 특수 최적화가 필수는 아니라고 안내합니다. <a href=\"https://developers.google.com/search/docs/appearance/ai-features\" target=\"_blank\" rel=\"noopener noreferrer\">Google Search Central 공식 안내<\/a> · AI 추천·검색 순위·매출을 보장하지 않습니다. 자료 확인: 2026.10.14.<\/p>\n<\/div><\/section>\n<section class=\"section price-section\" id=\"services\"><div class=\"wrap\"><div class=\"eyebrow\">ADVERTISING / BRANDING / MARKETING<\/div><div class=\"price-intro\"><h2>지금 필요한 일부터.<br>세 가지 시작 기준.<\/h2><p class=\"lede\" style=\"margin-top:24px\">어떤 문제가 먼저인지에 따라 선택합니다. 기본 예산과 포함 범위를 확인하고, 상담 후 필요한 업무와 최종 금액을 정합니다.<\/p><\/div><span class=\"price-status\">검토용 기본가 · 정식 요금 확정 전<\/span><div class=\"price-grid\"><article class=\"price-card\" id=\"service-advertising\"><div class=\"research-meta\">ADVERTISING<\/div><h3>광고대행<\/h3><p class=\"price-problem\">보여줄 준비는 됐는데, 원하는 손님에게 닿고 있나요?<\/p><div class=\"price-amount\">50만 원<small>월 기준 시작가 · 부가세 별도<\/small><\/div><ul><li>매장 1곳 · 광고 매체 1개 · 캠페인 1개 기준<\/li><li>기존 자료를 활용한 광고 문구 2안<\/li><li>주간 집행 점검 · 월간 결과 요약 1회<\/li><\/ul><p class=\"price-exclusions\">광고 집행비, 초기 계정·전환 설정, 촬영·영상·신규 디자인 제작은 별도 협의합니다.<\/p><a class=\"button button-dark\" href=\"#contact\" data-lead=\"service_advertising\">광고대행 상담하기 ↗<\/a><\/article><article class=\"price-card\" id=\"service-branding\"><div class=\"research-meta\">BRANDING<\/div><h3>브랜딩<\/h3><p class=\"price-problem\">좋은 점은 많은데, 우리답게 설명하는 말과 모습이 있나요?<\/p><div class=\"price-amount\">150만 원<small>프로젝트 기준 시작가 · 부가세 별도<\/small><\/div><ul><li>브랜드 인터뷰 1회 · 핵심 포지셔닝 1안<\/li><li>소개 문안 · 핵심 메시지 · 색상·서체 방향<\/li><li>기본 브랜드 가이드 1종 · 통합 수정 2회<\/li><\/ul><p class=\"price-exclusions\">네이밍, 로고 개발, 상표 검토, 촬영, 웹사이트·인쇄물 제작은 별도 범위로 제안합니다.<\/p><a class=\"button button-dark\" href=\"#contact\" data-lead=\"service_branding\">브랜딩 상담하기 ↗<\/a><\/article><article class=\"price-card\" id=\"service-marketing\"><div class=\"research-meta\">MARKETING<\/div><h3>마케팅<\/h3><p class=\"price-problem\">검색·사진·리뷰·예약이 하나의 방문 경험으로 이어지나요?<\/p><div class=\"price-amount\">100만 원<small>월 기준 시작가 · 부가세 별도<\/small><\/div><ul><li>매장 1곳 · 기존 채널 최대 2개 운영 기준<\/li><li>월 콘텐츠 4건 · 핵심 정보·FAQ 점검<\/li><li>월간 실행 계획 · 문의·예약 지표 검토 1회<\/li><\/ul><p class=\"price-exclusions\">광고 집행·운영, 초기 채널 구축, 촬영·영상, 번역 감수, 새 홈페이지 제작은 별도 협의합니다. 콘텐츠는 제공 자료 기준입니다.<\/p><a class=\"button button-dark\" href=\"#contact\" data-lead=\"service_marketing\">마케팅 상담하기 ↗<\/a><\/article><\/div><p class=\"price-overlap\">여러 서비스를 함께 진행하면 겹치는 업무를 한 번만 산정합니다. 견적서에는 납품물·운영비·광고 집행비를 나누어 표시합니다.<\/p><p class=\"price-terms\">위 금액과 수량은 운영 검토를 위한 제안이며 확정 견적이 아닙니다. 모든 금액은 원화·부가세 별도입니다. 초기 구축비, 최종 수량, 기간, 수정 범위와 결제 조건은 착수 전 견적서로 합의합니다. 검색 순위·AI 추천·매출 보장은 포함하지 않습니다. 외국어 대응 범위는 상담 후 정합니다.<\/p><\/div><\/section><!-- MARKET UPDATE END -->\n<section class=\"section\" id=\"faq\"><div class=\"wrap\" style=\"max-width:910px\"><div class=\"eyebrow\">FREQUENTLY ASKED QUESTIONS<\/div><h2 style=\"margin-bottom:39px\">궁금한 것은 먼저 확인해 보세요.<\/h2><div class=\"faq-list\"><details class=\"faq-item\"><summary>광고를 대신해 주는 회사인가요?<\/summary><p>광고 집행도 상황에 따라 검토할 수 있지만, 먼저 고객이 검색·비교·문의하는 과정에서 필요한 정보가 잘 보이는지 살펴봅니다. 바꿀 지점을 찾은 뒤 실제 작업 범위를 제안합니다.<\/p><\/details><details class=\"faq-item\"><summary>검색 순위를 올려 주나요?<\/summary><p>특정 순위나 매출을 보장하지 않습니다. 검색 플랫폼과 홈페이지의 정보를 같은 기준으로 정리하고, 고객이 쉽게 이해하는 화면을 만들기 위해 노력합니다.<\/p><\/details><details class=\"faq-item\"><summary>자료가 거의 없어도 시작할 수 있나요?<\/summary><p>가능합니다. 매장명과 지역, 현재 사용하는 채널을 확인한 뒤 우선순위를 정합니다. 사진이나 가격 안내 등 필요한 자료와 역할은 작업 전에 함께 합의합니다.<\/p><\/details><details class=\"faq-item\"><summary>비용은 어느 정도인가요?<\/summary><p>광고대행·브랜딩·마케팅의 기본가와 포함 범위는 위 서비스·가격 가이드에서 확인할 수 있습니다. 최종 수량, 기간, 별도 비용은 상담 후 견적서로 합의합니다.<\/p><\/details><\/div><\/div><\/section>\n<section class=\"section field-notes-section\" id=\"field-notes\"><div class=\"wrap\"><div class=\"field-notes-intro\"><div><div class=\"eyebrow\">WEPLACE FIELD NOTES · 함께 만드는 변화<\/div><h2>“여기 괜찮겠다.”<br>그 마음이 방문이 되도록.<\/h2><\/div><div><p class=\"lede\">댓글 하나, 글 하나. 선택의 이유는 쌓입니다. 사진을 보고, 다른 사람의 경험을 읽고, 예약을 누르기까지. 대표님과 전략을 고민하고 현장에서 실행한 과정을 남깁니다.<\/p><a class=\"button button-dark\" href=\"https://withweplace.kr/field-notes/\">실행과 변화의 기록 보기 ↗<\/a><a class=\"field-notes-data-link\" href=\"/field-notes/#working-industries\">현재 함께하는 업종과 업무 확인 →<\/a><a class=\"field-notes-data-link\" href=\"/field-notes/#signals\">우리 매장의 숫자로 비교해 보기 →<\/a><\/div><\/div><div class=\"field-notes-grid\"><div><span>01 · 함께 실행<\/span><h3>무엇을 했는지<\/h3><p>매장이 가진 장점을 사진·정보·안내에 담고, 손님이 망설이는 순간을 하나씩 정리합니다.<\/p><\/div><div><span>02 · 변화를 확인<\/span><h3>무엇이 달라졌는지<\/h3><p>작업 전후의 변화와 관찰한 반응을 기록합니다. 측정한 성과는 기간과 근거를 함께 보여줍니다.<\/p><\/div><div><span>03 · 다음 질문<\/span><h3>무엇을 더 해볼지<\/h3><p>대표님들의 현장 경험과 풀리지 않은 질문을 나누는 자리를 준비합니다. 첫 대화는 팀 파일럿으로 시작합니다.<\/p><\/div><\/div><p class=\"fine\">작업 기록은 고객과 공개 범위를 확인한 후 게시합니다. 내부 연락처·계약금액·관계 메모는 공개하지 않습니다.<\/p><\/div><\/section>\n<section class=\"section contact-section\" id=\"contact\"><div class=\"wrap contact-grid\"><div><div class=\"eyebrow\">NEXT MOVE · 1-PAGE DIAGNOSIS<\/div><h2>매장명 한 줄에서<br>시작하겠습니다.<\/h2><p class=\"lede\">어떤 서비스를 구매할지 지금 결정하지 않으셔도 됩니다. 고객이 첫 화면에서 어떤 질문을 하는지부터 함께 살펴보겠습니다.<\/p><div class=\"hero-rule\"><span><\/span>관찰 → 진단 → 우선순위 → 실행<\/div><\/div><div class=\"contact-card\"><h3>우리 매장도 한번 살펴볼까요?<\/h3><p>매장명과 지역만 알려주세요. 필요한 내용과 진단 범위부터 안내드립니다.<\/p><a class=\"button button-dark\" href=\"https://pf.kakao.com/_mxbexhX\" target=\"_blank\" rel=\"noopener\" data-lead=\"kakao_contact\">카카오톡으로 매장명 보내기 ↗<\/a><a class=\"button button-light\" href=\"mailto:weplace25@gmail.com?subject=Weplace%20%EB%A7 "readProgress\" class=\"progress\" aria-hidden=\"true\"><\/div>\n<header id=\"siteHeader\" class=\"header\">\n <div class=\"wrap header-inner\">\n  <a href=\"#top\" class=\"brand\" aria-label=\"Weplace home\"><span class=\"brand-mark\" aria-hidden=\"true\"><\/span><span>We,<em>place.<\/em><\/span><\/a>\n  <nav id=\"mainNav\" class=\"nav-links\" aria-label=\"Main navigation\"><a href=\"#journey\">How guests choose<\/a><a href=\"#experience\">Explore<\/a><a href=\"#research\">AI &amp; tourism<\/a><a href=\"#services\">Services<\/a><a href=\"https://withweplace.kr/field-notes/\">Field notes (Korean)<\/a><a class=\"nav-team\" href=\"https://withweplace.kr/client\">Client portal (KR) ↗<\/a><\/nav>\n  <div class=\"language-switch\" aria-label=\"Language\"><a lang=\"ko\" hreflang=\"ko\" href=\"https://withweplace.kr/\">한국어<\/a><span lang=\"en\" aria-current=\"page\">EN<\/span><\/div>\n  <a href=\"#contact\" class=\"nav-cta\" data-lead=\"header\">Discuss your business ↗<\/a>\n  <button type=\"button\" id=\"menuBtn\" class=\"nav-btn\" aria-label=\"Open menu\" aria-expanded=\"false\" aria-controls=\"mainNav\">☰<\/button>\n <\/div>\n<\/header>\n<main id=\"main\">\n<section class=\"hero\" id=\"top\">\n<div class=\"wrap hero-grid\">\n <div>\n  <div class=\"eyebrow\">WEPLACE · HUMAN-FIRST LOCAL EXPERIENCE<\/div>\n  <h1>A great place.<br>So why do guests  <em>still<br>hesitate?<\/em><\/h1>\n  <p class=\"lede\">Photos. Reviews. Prices. Another search. Weplace connects the information between discovery and booking, so guests can make a confident choice.<\/p>\n  <div class=\"hero-actions\"><a class=\"button button-dark\" href=\"#experience\" data-intent=\"hero_experience\">See through a guest's eyes <span aria-hidden=\"true\">↗<\/span><\/a><a class=\"button button-light\" href=\"#industries\">Find your industry <span aria-hidden=\"true\">↘<\/span><\/a><\/div>\n  <div class=\"hero-rule\"><span><\/span>Start with the reasons people choose a place.<\/div>\n <\/div>\n <div class=\"hero-stage\" aria-label=\"Illustration of the information a guest needs\">\n  <div class=\"hero-note\">FROM INFORMATION TO CONFIDENCE<\/div>\n  <div class=\"stage-card\">\n    <div class=\"stage-top\"><div class=\"dots\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div><span class=\"stage-url\">CUSTOMER VIEW · EXAMPLE<\/span><\/div>\n    <div class=\"stage-body\"><div class=\"stage-tag\">A guest's first questions<\/div><h3>It looks promising.<br><strong>Will I feel comfortable here?<\/strong><\/h3><div class=\"stage-panel\"><div><span>01. INFORMATION<\/span><b>Are prices clear?<\/b><\/div><div><span>02. EXPERIENCE<\/span><b>Do photos reflect reality?<\/b><\/div><div><span>03. ACTION<\/span><b>Is it easy to book?<\/b><\/div><\/div><div class=\"stage-footer\">Give guests answers without another search.<\/div><\/div>\n  <\/div>\n  <div class=\"floating-tip\"><span>WEPLACE INSIGHT<\/span>Guests do not need to know everything.  <b>Answer the question they have now<\/b> .<\/div>\n <\/div>\n<\/div>\n<\/section>\n<div class=\"micro-band\"><div class=\"wrap micro-grid\" aria-label=\"Four steps towards a visit\"><div><b>01<\/b> Discover<\/div><div><b>02<\/b> Check<\/div><div><b>03<\/b> Feel confident<\/div><div><b>04<\/b> Decide to visit<\/div><\/div><\/div>\n<section class=\"section\" id=\"journey\"><div class=\"wrap journey-grid\"><div class=\"journey-intro\"><div class=\"eyebrow\">HOW PEOPLE REALLY CHOOSE<\/div><h2>A visit begins<br>with a search,<br>before the door.<\/h2><p>You know your business. A first-time guest knows only a few screens. We look at the questions those screens answer, and the uncertainty they leave behind.<\/p><\/div><div class=\"journey-steps\"><div class=\"journey-step\"><span class=\"journey-n\">01<\/span><div><h3>Discover<\/h3><p>Understand what the place offers and whether it fits the occasion.<\/p><\/div><\/div><div class=\"journey-step\"><span class=\"journey-n\">02<\/span><div><h3>Check<\/h3><p>Compare photos, location, prices and reviews for a consistent picture.<\/p><\/div><\/div><div class=\"journey-step\"><span class=\"journey-n\">03<\/span><div><h3>Feel confident<\/h3><p>Find enough reliable information to feel comfortable choosing.<\/p><\/div><\/div><div class=\"journey-step\"><span class=\"journey-n\">04<\/span><div><h3>Take the next step<\/h3><p>Call, book or get directions in the way that feels easiest.<\/p><\/div><\/div><\/div><\/div><\/section>\n<section class=\"section lens-section\" id=\"experience\"><div class=\"wrap lens-grid\"><div class=\"lens-controls\"><div class=\"eyebrow\">TRY IT YOURSELF · 30-SECOND EXPLORER<\/div><h2>Borrow your guest's<br>point of view.<\/h2><p class=\"lede\">Choose an industry and explore a visitor's possible questions. Which answer should your own business show first?<\/p><div class=\"lens-choices\" role=\"group\" aria-label=\"Choose an industry\"><button type=\"button\" class=\"choice\" data-industry=\"dining\" aria-pressed=\"true\">Restaurants &amp; cafés<\/button><button type=\"button\" class=\"choice\" data-industry=\"stay\" aria-pressed=\"false\">Hotels &amp; stays<\/button><button type=\"button\" class=\"choice\" data-industry=\"beauty\" aria-pressed=\"false\">Beauty &amp; care<\/button><button type=\"button\" class=\"choice\" data-industry=\"general\" aria-pressed=\"false\">Other businesses<\/button><\/div><p class=\"fine\" style=\"margin-top:18px\">Illustrative questions, not findings from a customer survey.<\/p><\/div><div class=\"lens-output\" aria-live=\"polite\" aria-atomic=\"true\"><div class=\"lens-header\"><span>A guest's first question<\/span><span id=\"lensLabel\">DINING EXPERIENCE<\/span><\/div><div class=\"lens-screen\"><div class=\"question-label\">Imagine asking this before a visit.<\/div><h3 id=\"lensQuestion\">“Can I get a table today?<br>What is on the menu, and what does it cost?”<\/h3><p class=\"question-sub\" id=\"lensDescription\">Put prices, menus, opening hours and waiting arrangements together, so guests have less to look up again.<\/p><div class=\"lens-signals\"><div><span>Essential information<\/span><strong id=\"lensSignal1\">Menu and prices<\/strong><\/div><div><span>Confidence signals<\/span><strong id=\"lensSignal2\">Recent photos and reviews<\/strong><\/div><\/div><\/div><div class=\"lens-bottom\"><span class=\"lens-disclaimer\">Weplace · Illustrative guest perspective<\/span><a id=\"lensLink\" class=\"button button-dark\" href=\"https://withweplace.kr/industries/dining.html\">Industry guide (Korean) ↗<\/a><\/div><\/div><\/div><\/section>\n<section class=\"section\" id=\"difference\"><div class=\"wrap\"><div class=\"section-head\"><div><div class=\"eyebrow\">BEFORE / AFTER · CONCEPT EXAMPLE<\/div><h2>The same place.<br>A clearer first impression.<\/h2><\/div><p class=\"lede\" style=\"font-size:16px;max-width:320px\">Sometimes a guest hesitates because an essential answer is hard to find.<\/p><\/div><div class=\"compare-grid\"><article class=\"compare-card\"><header><span>BEFORE · Another search needed<\/span><small>Illustration<\/small><\/header><div class=\"compare-mock\"><div class=\"mock-name\">A special moment in a cosy space<\/div><div class=\"mock-photo mock-photo--before\">\n  <img src=\"https://withweplace.kr/img/ind-dining.jpg\" alt=\"Restaurant reference photo used in both information layout examples\" loading=\"lazy\" decoding=\"async\" width=\"1122\" height=\"1402\">\n  <span class=\"mock-image-caption\">A photo with too few answers<\/span>\n  <div class=\"mock-chips\" aria-label=\"Questions that require another search\"><span>Prices?<\/span><span>Parking?<\/span><span>Hours?<\/span><\/div>\n<\/div><div class=\"mock-lines\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div><p class=\"fine\" style=\"margin-top:18px\">Where are the prices? Can I park? Is this photo recent?<\/p><\/div><p class=\"compare-copy\">A pleasant promise, but  <b>the practical facts<\/b> are still missing.<\/p><\/article><article class=\"compare-card good\"><header><span>AFTER · Answers in one place<\/span><small>Illustration<\/small><\/header><div class=\"compare-mock\"><div class=\"mock-name\">Three things to know before a visit<\/div><div class=\"mock-photo mock-photo--after\">\n  <img src=\"https://withweplace.kr/img/ind-dining.jpg\" alt=\"The same restaurant reference photo with clearer practical information\" loading=\"lazy\" decoding=\"async\" width=\"1122\" height=\"1402\">\n  <span class=\"mock-image-caption\">The photo and the facts, together<\/span>\n  <div class=\"mock-chips\" aria-label=\"Information visible at a glance\"><span>Menu &amp; prices<\/span><span>Opening hours<\/span><span>Parking &amp; booking<\/span><\/div>\n<\/div><div class=\"mock-lines\"><span>✓ Clear prices and conditions<\/span><span>✓ Current photos and space details<\/span><span>✓ Directions, parking and booking together<\/span><\/div><p class=\"fine\" style=\"margin-top:18px\">The answers are visible. The next step is easier to choose.<\/p><\/div><p class=\"compare-copy\">Help guests find  <b>reasons to feel confident<\/b> sooner.<\/p><\/article><\/div><p class=\"compare-footnote\">These layouts illustrate information design. They are not measured conversion results from a real business.<\/p><\/div><\/section>\n<section class=\"section industries\" id=\"industries\"><div class=\"wrap\"><div class=\"section-head\"><div><div class=\"eyebrow\">INDUSTRY EXPERIENCE SYSTEMS<\/div><h2>Different industries.<br>Different questions.<\/h2><\/div><p class=\"lede\" style=\"font-size:16px;max-width:330px\">Start with the information people need in your industry, then choose the right work.<\/p><\/div><div class=\"industry-grid\"><a class=\"industry-card\" href=\"https://withweplace.kr/industries/dining.html\" data-sector=\"dining\"><div class=\"industry-img\"><img src=\"https://withweplace.kr/img/ind-dining.jpg\" alt=\"Dining space and food experience\" loading=\"lazy\"><\/div><div class=\"industry-copy\"><div class=\"eyebrow\">FOOD &amp; DINING<\/div><h3>Restaurants &amp; cafés<\/h3><p>Bring menus, prices and atmosphere together to make choosing a place easier.<\/p><div class=\"industry-foot\"><span>Industry guide (Korean)<\/span><span aria-hidden=\"true\">↗<\/span><\/div><\/div><\/a><a class=\"industry-card\" href=\"https://withweplace.kr/industries/stay.html\" data-sector=\"stay\"><div class=\"industry-img\"><img src=\"https://withweplace.kr/img/ind-stay.jpg\" alt=\"Guest room, bedding and hotel atmosphere\" loading=\"lazy\"><\/div><div class=\"industry-copy\"><div class=\"eyebrow\">STAY &amp; HOSPITALITY<\/div><h3>Hotels &amp; stays<\/h3><p>Connect room details, parking, arrival and booking information for an unfamiliar destination.<\/p><div class=\"industry-foot\"><span>Industry guide (Korean)<\/span><span aria-hidden=\"true\">↗<\/span><\/div><\/div><\/a><a class=\"industry-card\" href=\"https://withweplace.kr/industries/beauty/\" data-sector=\"beauty\"><div class=\"industry-img\"><img src=\"https://withweplace.kr/img/ind-beauty.jpg\" alt=\"Calm interior of a beauty space\" loading=\"lazy\"><\/div><div class=\"industry-copy\"><div class=\"eyebrow\">BEAUTY &amp; CARE<\/div><h3>Beauty &amp; care<\/h3><p>Clarify services, real examples and consultation steps with expectations and concerns in mind.<\/p><div class=\"industry-foot\"><span>Industry guide (Korean)<\/span><span aria-hidden=\"true\">↗<\/span><\/div><\/div><\/a><\/div><p class=\"fine\" style=\"margin-top:18px\">Industry guides are currently in Korean. They include concept imagery, sourced statistics and illustrative calculators, not verified client results.<\/p><\/div><\/section>\n<section class=\"section\" id=\"how\"><div class=\"wrap\"><div class=\"section-head\"><div><div class=\"eyebrow\">HOW WE WORK<\/div><h2>Observe carefully.<br>Leave a system behind.<\/h2><\/div><p class=\"lede\" style=\"font-size:16px;max-width:340px\">Document the work so your team can maintain it with the same standards.<\/p><\/div><div class=\"process-grid\"><div class=\"process-card\"><span class=\"num\">STEP 01 / OBSERVE<\/span><h3>Observe the current experience<\/h3><p>Review the website, Naver, Google, photos and reviews to identify points of hesitation.<\/p><\/div><div class=\"process-card\"><span class=\"num\">STEP 02 / PRIORITIZE<\/span><h3>Agree on priorities<\/h3><p>Identify inconsistencies and missing answers, then agree on what to improve first.<\/p><\/div><div class=\"process-card\"><span class=\"num\">STEP 03 / BUILD<\/span><h3>Make practical improvements<\/h3><p>Organise photos, descriptions, prices, FAQs, directions and enquiry or booking routes.<\/p><\/div><div class=\"process-card\"><span class=\"num\">STEP 04 / LEARN<\/span><h3>Review real responses<\/h3><p>Track observable actions such as calls, direction requests, enquiries and bookings.<\/p><\/div><\/div><div class=\"result-banner\"><div><h3>Show what changed, with evidence and context.<\/h3><p>Keep an audit, action checklist, change log and measurement definitions for the next improvement.<\/p><\/div><a href=\"#audit\" class=\"linkline\">Review your business ↗<\/a><\/div><\/div><\/section>\n<section class=\"section audit-section\" id=\"audit\"><div class=\"wrap\"><div class=\"audit-head\"><div><div class=\"eyebrow\">QUICK AUDIT · SELF CHECK<\/div><h2>Your first impression:<br>are the essentials easy to find?<\/h2><p class=\"lede\">Select what you can confidently confirm. The unanswered questions matter more than a score.<\/p><\/div><a href=\"#contact\" class=\"button button-outline\" style=\"color:#f2f8f1;border-color:#799b84\">Discuss an audit ↗<\/a><\/div><div class=\"audit-box\"><span class=\"audit-counter\">6 SIGNALS OF CUSTOMER CONFIDENCE<\/span><div class=\"audit-options\" id=\"auditOptions\" role=\"group\" aria-label=\"Online information self-check\"><button type=\"button\" class=\"audit-opt\" aria-pressed=\"false\" data-audit=\"Recent photos\"><b aria-hidden=\"true\">✓<\/b>Our main photos show the place as it is today<\/button><button type=\"button\" class=\"audit-opt\" aria-pressed=\"false\" data-audit=\"Prices\"><b aria-hidden=\"true\">✓<\/b>Prices, menus and conditions are clear<\/button><button type=\"button\" class=\"audit-opt\" aria-pressed=\"false\" data-audit=\"Parking and location\"><b aria-hidden=\"true\">✓<\/b>Directions, parking and arrival details are available<\/button><button type=\"button\" class=\"audit-opt\" aria-pressed=\"false\" data-audit=\"Consistent information\"><b aria-hidden=\"true\">✓<\/b>Key facts are consistent across platforms<\/button><button type=\"button\" class=\"audit-opt\" aria-pressed=\"false\" data-audit=\"Reviews\"><b aria-hidden=\"true\">✓<\/b>Recent reviews and responses are maintained<\/button><button type=\"button\" class=\"audit-opt\" aria-pressed=\"false\" data-audit=\"Booking route\"><b aria-hidden=\"true\">✓<\/b>Booking and contact details are easy to find<\/button><\/div><div class=\"audit-status\" aria-live=\"polite\"><div class=\"audit-result\"><strong id=\"auditMessage\">Start with what you know.<\/strong><p id=\"auditHint\">An unchecked item is not automatically a problem.<\/p><\/div><div class=\"audit-score\" id=\"auditScore\">0 / 6<\/div><\/div><\/div><p class=\"audit-foot\">This is a self-check, not a formal audit. We can help you verify uncertain items.<\/p><\/div><\/section>\n<section class=\"section research-section\" id=\"research\"><div class=\"wrap\">\n<div class=\"eyebrow\">SEARCH & INTERNATIONAL GUESTS<\/div><h2>Search is changing.<br>The need for clear facts remains.<\/h2>\n<p class=\"lede\" style=\"margin-top:24px\">Whether an AI summarises your business or a traveller searches in English, do your prices, photos, location and booking details tell the same story?<\/p>\n<div class=\"research-grid\">\n<article class=\"research-panel\"><div class=\"research-meta\">KOREA · 2024 ANNUAL DATA<\/div><h3>Help international guests<br>make an informed choice.<\/h3><div class=\"research-stat\">16.37<small>million<\/small><\/div><div class=\"subtle\">International visitor arrivals to Korea in 2024<\/div><p>MCST reports this was <strong>93.5%<\/strong> of the 2019 level. It describes a national market, not demand in a specific neighbourhood or revenue for a business.<\/p><div class=\"market-note\"><strong>What to examine locally<\/strong><br>Visits and spending by area and nationality → useful languages → menus, prices and directions → actual enquiries and visits<\/div><p class=\"research-source\">Source: <a href=\"https://www.mcst.go.kr/english/policy/pressView.jsp?pSeq=554\" target=\"_blank\" rel=\"noopener noreferrer\">MCST, published 24 Oct 2025<\/a>. Full-year 2024 figures, not the latest year's performance. Local analysis requires separately checking the period, area and definitions in <a href=\"https://datalab.visitkorea.or.kr/datalab/portal/nat/getForTourForm.do\" target=\"_blank\" rel=\"noopener noreferrer\">Korea Tourism Data Lab<\/a>.<\/p><\/article>\n<article class=\"research-panel\"><div class=\"research-meta\">U.S. GOOGLE SEARCH · MARCH 2025<\/div><h3>Information matters<br>before a website click.<\/h3><p>In a study of 900 U.S. adults, traditional search-result links were clicked in these shares of visits:<\/p><figure class=\"market-bars\" aria-label=\"Traditional result link clicks: 8% with an AI summary; 15% without. Shared scale from 0 to 20%.\"><div class=\"market-bar-label\"><span>With an AI summary<\/span><strong>8%<\/strong><\/div><div class=\"market-track\" aria-hidden=\"true\"><div class=\"market-fill\" style=\"width:40%\"><\/div><\/div><div class=\"market-bar-label\"><span>Without an AI summary<\/span><strong>15%<\/strong><\/div><div class=\"market-track\" aria-hidden=\"true\"><div class=\"market-fill secondary\" style=\"width:75%\"><\/div><\/div><div class=\"market-axis\" aria-hidden=\"true\"><span>0%<\/span><span>10%<\/span><span>20%<\/span><\/div><\/figure><p class=\"research-source\">Source: <a href=\"https://www.pewresearch.org/short-reads/2025/07/22/google-users-are-less-likely-to-click-on-links-when-an-ai-summary-appears-in-the-results/\" target=\"_blank\" rel=\"noopener noreferrer\">Pew Research Center, 22 Jul 2025<\/a>. March browsing and April result collection. This observational U.S. Google study does not establish causation or measure Korean customers or every AI service.<\/p><div class=\"market-note\"><strong>Our interpretation<\/strong><br>Keep essential facts and practical answers clear and consistent, including where people see them before visiting your website.<\/div><\/article>\n<\/div>\n<div class=\"research-actions\"><article class=\"research-action\"><h3>01. Consistent facts<\/h3><p>Align business names, hours, location and services across your website, Naver Place and Google Business Profile.<\/p><\/article><article class=\"research-action\"><h3>02. Accessible answers<\/h3><p>Publish prices, menus, booking conditions and FAQs as readable text in useful languages, alongside relevant photos.<\/p><\/article><article class=\"research-action\"><h3>03. Measurable change<\/h3><p>Distinguish visibility, contact clicks, actual enquiries and bookings. A click alone is not a sale.<\/p><\/article><\/div>\n<p class=\"research-source\">Google says established SEO fundamentals apply to its AI search features, without special additional optimisation requirements. <a href=\"https://developers.google.com/search/docs/appearance/ai-features\" target=\"_blank\" rel=\"noopener noreferrer\">Google Search Central guidance<\/a>. We do not guarantee AI recommendations, rankings or revenue. Sources checked: 14 Oct 2026.<\/p>\n<\/div><\/section>\n<section class=\"section price-section\" id=\"services\"><div class=\"wrap\"><div class=\"eyebrow\">ADVERTISING / BRANDING / MARKETING<\/div><div class=\"price-intro\"><h2>Three ways to begin.<br>A clear scope for each.<\/h2><p class=\"lede\" style=\"margin-top:24px\">Choose by the problem you need to solve. Start with a budget guideline, then agree on scope and a final quote.<\/p><\/div><span class=\"price-status\">PROPOSED STARTING FEES · UNDER REVIEW<\/span><div class=\"price-grid\"><article class=\"price-card\" id=\"service-advertising\"><div class=\"research-meta\">ADVERTISING<\/div><h3>Advertising<\/h3><p class=\"price-problem\">Ready to be seen, but not reaching the people you want?<\/p><div class=\"price-amount\">₩500,000<small>From · per month · VAT excluded<\/small><\/div><ul><li>One location, one ad platform, one campaign<\/li><li>Two copy variants using existing materials<\/li><li>Weekly campaign checks and one monthly summary<\/li><\/ul><p class=\"price-exclusions\">Media spend, initial account or conversion setup, photography, video and new design production are quoted separately.<\/p><a class=\"button button-dark\" href=\"#contact\" data-lead=\"service_advertising\">Discuss advertising ↗<\/a><\/article><article class=\"price-card\" id=\"service-branding\"><div class=\"research-meta\">BRANDING<\/div><h3>Branding<\/h3><p class=\"price-problem\">You know what makes you good. Does your message and identity show it?<\/p><div class=\"price-amount\">₩1,500,000<small>From · per project · VAT excluded<\/small><\/div><ul><li>One brand interview and one positioning direction<\/li><li>Introduction, core messages, colour and type direction<\/li><li>One basic brand guide and two consolidated revision rounds<\/li><\/ul><p class=\"price-exclusions\">Naming, logo development, trademark review, photography, website production and printed materials are scoped separately.<\/p><a class=\"button button-dark\" href=\"#contact\" data-lead=\"service_branding\">Discuss branding ↗<\/a><\/article><article class=\"price-card\" id=\"service-marketing\"><div class=\"research-meta\">MARKETING<\/div><h3>Marketing<\/h3><p class=\"price-problem\">Do search, photos, reviews and booking connect into one clear journey?<\/p><div class=\"price-amount\">₩1,000,000<small>From · per month · VAT excluded<\/small><\/div><ul><li>One location and up to two existing channels<\/li><li>Four content items per month, key fact and FAQ checks<\/li><li>Monthly action plan and one enquiry/booking metric review<\/li><\/ul><p class=\"price-exclusions\">Paid media and ad management, initial channel setup, photography, video, translation review and new websites are quoted separately. Content uses supplied materials.<\/p><a class=\"button button-dark\" href=\"#contact\" data-lead=\"service_marketing\">Discuss marketing ↗<\/a><\/article><\/div><p class=\"price-overlap\">Combining services? We scope shared work once and separate the deliverables, media budget and operating fees in your quote.<\/p><p class=\"price-terms\">All amounts are in Korean won, exclusive of VAT. These are proposed starting fees, not a confirmed offer. Final fees, setup costs, quantities, term, revision scope and payment conditions are agreed before work begins. No ranking, AI recommendation or revenue guarantee. English support and additional languages are confirmed during consultation.<\/p><\/div><\/section>\n<section class=\"section\" id=\"faq\"><div class=\"wrap\" style=\"max-width:910px\"><div class=\"eyebrow\">FREQUENTLY ASKED QUESTIONS<\/div><h2 style=\"margin-bottom:39px\">A few useful answers.<\/h2><div class=\"faq-list\"><details class=\"faq-item\"><summary>Do you manage advertising?<\/summary><p>Yes, advertising is one service area. We first review what guests see when they search, compare and enquire, then propose the work your business needs.<\/p><\/details><details class=\"faq-item\"><summary>Do you guarantee search rankings?<\/summary><p>We do not guarantee a ranking, AI recommendation or revenue. Our work makes business information consistent and easier to understand.<\/p><\/details><details class=\"faq-item\"><summary>Can we start with very little material?<\/summary><p>Yes. Share your business name, location and current channels. We agree on priorities, materials and responsibilities before work begins.<\/p><\/details><details class=\"faq-item\"><summary>What does it cost?<\/summary><p>See the service and pricing guide above for proposed starting fees and inclusions. Final quantities, duration and additional costs are agreed in your quote after consultation.<\/p><\/details><\/div><\/div><\/section>\n<section class=\"section field-notes-section\" id=\"field-notes\"><div class=\"wrap\"><div class=\"field-notes-intro\"><div><div class=\"eyebrow\">WEPLACE FIELD NOTES · CHANGE IN PRACTICE<\/div><h2>“This looks like my kind of place.”<br>Help that feeling become a visit.<\/h2><\/div><div><p class=\"lede\">Photos, reviews and practical details add up. We work with owners to connect those reasons to choose, and document what happens in practice.<\/p><a class=\"button button-dark\" href=\"https://withweplace.kr/field-notes/\">Explore field notes (Korean) ↗<\/a><a class=\"field-notes-data-link\" href=\"/field-notes/#working-industries\">View approved industry activity (Korean) →<\/a><a class=\"field-notes-data-link\" href=\"/field-notes/#signals\">Explore your own numbers (Korean) →<\/a><\/div><\/div><div class=\"field-notes-grid\"><div><span>01 · PUT INTO PRACTICE<\/span><h3>What we did<\/h3><p>Translate a business's strengths into useful photos, facts and guidance.<\/p><\/div><div><span>02 · REVIEW THE CHANGE<\/span><h3>What changed<\/h3><p>Record the before and after, with time periods and supporting evidence for measured results.<\/p><\/div><div><span>03 · ASK THE NEXT QUESTION<\/span><h3>What comes next<\/h3><p>We are preparing a space for owners' experiences and questions, starting with a team pilot.<\/p><\/div><\/div><p class=\"fine\">Client approval determines what we publish. Internal contacts, contract amounts and relationship notes stay private.<\/p><\/div><\/section>\n<section class=\"section contact-section\" id=\"contact\"><div class=\"wrap contact-grid\"><div><div class=\"eyebrow\">NEXT MOVE · 1-PAGE DIAGNOSIS<\/div><h2>Start with your<br>business name.<\/h2><p class=\"lede\">You do not need to choose a package yet. Let's first look at the questions a new guest might have.<\/p><div class=\"hero-rule\"><s
