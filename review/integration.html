<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>WEPLACE · 공개 연결 테스트</title><link rel="stylesheet" href="/assets/css/industry-folders.css"><style>body{margin:0;background:#f7f8f5;color:#173a32;font:15px/1.7 system-ui,sans-serif}main{max-width:1180px;margin:50px auto;padding:0 24px}h1{font-size:28px}button,a{min-height:44px}button{padding:10px 16px;margin:4px;border:1px solid #8da28b;background:white;color:inherit;border-radius:5px;cursor:pointer;font:inherit}button[aria-pressed=true]{background:#173a32;color:white}button:focus-visible,a:focus-visible{outline:3px solid #236db4;outline-offset:3px}.notice{padding:16px;background:#e5edde;border:1px solid #bbcab4}.test-frame{margin:45px 0}code{word-break:break-all}a{color:inherit}#testState{font-weight:700}</style></head><body><main><a href="/review/audience.html">← 화면 검토</a><h1>공개 업종 API · 실패와 복구 검수</h1><p class="notice">가상 데이터 전용 테스트입니다. 운영 API·CRM에 접속하거나 저장하지 않습니다. 아래 숫자는 테스트 입력값이며 실제 관리 수·잔여석이 아닙니다. 계약·결제·예약 기능은 없습니다.</p><div role="group" aria-label="공개 API 상태 선택"><button data-mode="empty" aria-pressed="true">승인된 현황 없음</button><button data-mode="approved" aria-pressed="false">가상 승인 응답</button><button data-mode="expired" aria-pressed="false">공개 기한 만료</button><button data-mode="malformed" aria-pressed="false">잘못된 응답</button><button data-mode="error" aria-pressed="false">연결 오류</button><button data-mode="privacy" aria-pressed="false">허용 외 필드 포함</button></div><p id="testState" role="status">승인된 현황 없음</p><div class="test-frame"><weplace-industries></weplace-industries></div><p>검수 기준: 미승인·만료·실패 응답에서 수치가 사라져야 합니다. 오류 후 재시도, 열린 폴더·키보드 초점 유지, 허용 외 필드 미노출을 확인합니다.</p><p>직원·고객 인증과 공개 저널의 승인 검증은 FLOW 서버 테스트에서 수행합니다. 이 화면은 서버 인증을 대체하지 않습니다.</p></main><script>
(()=>{'use strict';let mode='empty';const day=n=>{const d=new Date();d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);};
window.fetch=async()=>{if(mode==='error')throw new Error('Synthetic offline');if(mode==='malformed')return {ok:true,json:async()=>({unexpected:[]})};if(mode==='empty')return {ok:true,json:async()=>({industries:[]})};const item={industry:'요식업',count:0,managedCount:2,capacity:4,remaining:2,capacityReviewedAt:new Date().toISOString(),activeUntil:day(mode==='expired'?-1:1),updates:[]};if(mode==='privacy'){item.internalClientId='SYNTHETIC_PRIVATE_ID';item.contact='SYNTHETIC_PRIVATE_CONTACT';item.unapprovedNote='SYNTHETIC_PRIVATE_NOTE';}return {ok:true,json:async()=>({industries:[item]})};};
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));document.getElementById('testState').textContent=b.textContent+' · 가상 데이터';document.querySelector('weplace-industries').load();}));})();
</script><script src="/assets/js/industry-folders.js"></script></body></html>
