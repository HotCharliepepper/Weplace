<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>WEPLACE 화면 검토</title><style>body{margin:0;background:#e8e5df;color:#302e29;font:14px system-ui,sans-serif}header{padding:12px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}button,a{font:inherit;color:inherit}button{padding:8px 12px;cursor:pointer}main{overflow:auto;padding:0 16px 16px}iframe{display:block;width:390px;height:844px;border:1px solid #c8c3b7;background:white;margin:auto}</style><header><strong>WEPLACE 화면 검토</strong><button data-width="320">모바일 320px</button><button data-width="390">모바일 390px</button><button data-width="768">태블릿 768px</button><button data-width="1440">PC 1440px</button><button data-page="/">홈페이지</button><button data-page="/field-notes/">작업·변화 기록</button></header><main><iframe title="검토 화면" src="/"></iframe></main><script>document.querySelectorAll("button[data-width]").forEach(b=>b.addEventListener("click",()=>document.querySelector("iframe").style.width=b.dataset.width+"px"));document.querySelectorAll("button[data-page]").forEach(b=>b.addEventListener("click",()=>document.querySelector("iframe").src=b.dataset.page));</script></html>
