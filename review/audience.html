<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>WEPLACE · 화면 검토</title><style>body{margin:0;background:#e8e5df;color:#243d31;font:14px/1.6 system-ui,sans-serif}header{padding:14px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}button,a{font:inherit;color:inherit}button{padding:9px 12px;min-height:44px;cursor:pointer;border:1px solid #aebbb0;border-radius:5px;background:white}button[aria-pressed=true]{background:#244c3d;color:white}button:focus-visible,a:focus-visible{outline:3px solid #276eb4;outline-offset:3px}main{overflow:auto;padding:0 16px 16px}iframe{display:block;width:390px;height:844px;border:1px solid #adb8a8;background:white;margin:auto}p{padding:0 20px}</style></head><body><header><strong>WEPLACE 화면 검토</strong><div role="group" aria-label="화면 폭"><button data-width="360" aria-pressed="false">360</button><button data-width="390" aria-pressed="true">390</button><button data-width="430" aria-pressed="false">430</button><button data-width="768" aria-pressed="false">768</button><button data-width="1024" aria-pressed="false">1024</button><button data-width="1440" aria-pressed="false">1440px</button></div><div role="group" aria-label="페이지"><button data-page="/">홈</button><button data-page="/industries/">업종</button><button data-page="/check/">자가진단</button><button data-page="/meeting/">미팅</button><button data-page="/my-store/">내 매장 관리</button><button data-page="/field-notes/">공개 기록</button></div><a href="/review/integration.html">공개 API 테스트 →</a></header><p>검토용 화면입니다. 실제 상담·예약·계약이 생성되지 않습니다. 폭 선택은 검수 도구이며 해당 기기에서의 검수 완료를 의미하지 않습니다.</p><main><iframe title="선택한 페이지 미리보기" src="/"></iframe></main><script>document.querySelectorAll('[data-width]').forEach(b=>b.addEventListener('click',()=>{document.querySelector('iframe').style.width=b.dataset.width+'px';document.querySelectorAll('[data-width]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));}));document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>{document.querySelector('iframe').src=b.dataset.page;}));</script></body></html>
